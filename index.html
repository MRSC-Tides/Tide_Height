<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRSC Tide & Pressure Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        .status-header {
            font-size: 1.5rem;
            font-family: "Arial Black", "Impact", sans-serif; 
            font-weight: 900;
            color: #000000;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 15px;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 480px) {
            .status-header {
                font-size: 1rem;
            }
        }

        .chart-container {
            position: relative;
            width: 95vw;
            height: 85vh;
            max-width: 1200px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        .status-header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            font-family: "Arial Black", "Impact", sans-serif;
            font-weight: 900;
            text-transform: none;
            color: #000000;
            text-align: center;
            width: 90%;
            box-sizing: border-box;
            z-index: 10;
        }
        .date-footer {
            position: absolute;
            bottom: 5px;
            right: 15px;
            font-size: 0.9rem;
            color: #333333;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 10;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <div class="status-header" id="latest-reading">MRSC Tide Height: Loading...</div>
        <canvas id="multiFieldChart"></canvas>
        <div class="date-footer" id="current-date-display"></div>
    </div>
    
    <script>
        // --- CONFIGURATION ---
        const CHANNEL_ID = '3239925'; 
        const READ_API_KEY = '2380EH2E5H0RPTXU'; 
        
        let tsChart;

        // Calculates a 3-point rolling average
        function calculateRollingAverage(data, windowSize = 3) {
            return data.map((point, index, array) => {
                const start = Math.max(0, index - windowSize + 1);
                const subset = array.slice(start, index + 1);
                const sum = subset.reduce((acc, curr) => acc + curr.y, 0);
                
                return {
                    x: point.x,
                    y: sum / subset.length
                };
            });
        }

        function updateHeader(latestSmoothedPoint) {
            const headerDiv = document.getElementById('latest-reading');
            const dateDiv = document.getElementById('current-date-display');
            if (!latestSmoothedPoint) {
                headerDiv.innerText = "MRSC Tide Height: No data available";
                return;
            }

            const val1 = latestSmoothedPoint.y.toFixed(2);
            const timeObj = latestSmoothedPoint.x;
            const timeString = timeObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            headerDiv.innerText = `MRSC Tide Height: ${val1}m at ${timeString}`;

            const options = { month: 'short', day: '2-digit', year: 'numeric' };
            dateDiv.innerText = timeObj.toLocaleDateString('en-US', options);
        }

        async function fetchThingSpeakData() {
            let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?minutes=720&nocache=${Date.now()}`;
            if(READ_API_KEY) { url += `&api_key=${READ_API_KEY}`; }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.feeds || data.feeds.length === 0) {
                    console.warn("No feeds returned from ThingSpeak API.");
                    return;
                }

                // 1. Parse raw tide data
                const rawTideData = data.feeds
                    .filter(feed => feed.field1 !== null && feed.field1 !== undefined)
                    .map(feed => ({
                        x: new Date(feed.created_at),
                        y: parseFloat(feed.field1)
                    }));

                // 2. Smooth the tide data with 3-point rolling average
                const smoothedTideData = calculateRollingAverage(rawTideData, 3);

                // 3. Pressure data remains unsmoothed
                const pressureData = data.feeds
                    .filter(feed => feed.field2 !== null && feed.field2 !== undefined)
                    .map(feed => ({
                        x: new Date(feed.created_at),
                        y: parseFloat(feed.field2)
                    }));

                // Update the header with the latest smoothed point
                updateHeader(smoothedTideData[smoothedTideData.length - 1]);
                updateChart(smoothedTideData, pressureData);
            } catch (error) {
                console.error("Error fetching data from ThingSpeak:", error);
            }
        }

        function updateChart(tideData, pressureData) {
            const now = new Date();
            const twelveHoursAgo = new Date(now.getTime() - (12 * 60 * 60 * 1000));

            if (tsChart) {
                tsChart.options.scales.x.min = twelveHoursAgo;
                tsChart.options.scales.x.max = now;
                tsChart.data.datasets[0].data = tideData;
                tsChart.data.datasets[1].data = pressureData;
                tsChart.update();
                return;
            }

            const ctx = document.getElementById('multiFieldChart').getContext('2d');
            tsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Tide Height (m)',
                            data: tideData,
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0, 123, 255, 0.1)',
                            yAxisID: 'yTide',
                            tension: 0.3,
                            pointRadius: 0
                        },
                        {
                            label: 'Atmospheric Pressure (hPa)',
                            data: pressureData,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            yAxisID: 'yPressure',
                            tension: 0.3,
                            pointRadius: 0
                        }
                    ]
                },
                plugins: [{
                    id: 'topBorderFix',
                    afterDatasetsDraw(chart) {
                        const { ctx, chartArea: { left, top, right } } = chart;
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(left, top);
                        ctx.lineTo(right, top);
                        ctx.stroke();
                        ctx.restore();
                    }
                }],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 40,
                            bottom: 10
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            min: twelveHoursAgo,
                            max: now,
                            border: {
                                color: '#000000',
                                width: 2
                            },
                            time: {
                                unit: 'hour',
                                stepSize: 1,
                                displayFormats: {
                                    hour: 'HH:mm'
                                }
                            },
                            ticks: {
                                minRotation: 45,
                                maxRotation: 45,
                                autoSkip: true,
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            },
                            title: {
                                display: false
                            },
                            grid: {
                                lineWidth: 2,
                                color: 'rgba(0,0,0,0.15)'
                            }
                        },
                        yTide: {
                            type: 'linear',
                            position: 'left',
                            min: 3,         
                            max: 5.5,
                            border: {
                                color: '#000000',
                                width: 2
                            },
                            title: { 
                                display: true, 
                                text: 'Tide Height (m)',
                                color: '#007bff',
                                font: { 
                                    weight: 'bold',
                                    size: 16
                                }
                            },
                            ticks: {
                                stepSize: 0.25,
                                color: '#007bff',
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                lineWidth: 2,
                                color: 'rgba(0,0,0,0.15)'
                            }
                        },
                        yPressure: {
                            type: 'linear',
                            position: 'right',
                            min: 950,       
                            max: 1050,
                            border: {
                                color: '#000000',
                                width: 2
                            },
                            title: { 
                                display: true, 
                                text: 'Pressure (hPa)',
                                color: '#dc3545',
                                font: { 
                                    weight: 'bold',
                                    size: 16
                                }
                            },
                            ticks: {
                                stepSize: 10,
                                color: '#dc3545',
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        fetchThingSpeakData();
        setInterval(fetchThingSpeakData, 30000);

        window.addEventListener('resize', () => {
            if (tsChart) { 
                tsChart.resize(); 
                fetchThingSpeakData();
            }
        });
    </script>
</body>
</html>
